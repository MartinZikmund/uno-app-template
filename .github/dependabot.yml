version: 2
updates:
- package-ecosystem: github-actions
  directories:
    - "/"
    - "/.github/actions/setup-dotnet-build"
    - "/.github/actions/app-version"
    - "/.github/actions/publish-once"
  schedule:
    interval: weekly
    time: "01:00"
  open-pull-requests-limit: 10

- package-ecosystem: nuget
  directories:
    - "*"
  schedule:
    interval: weekly
    time: "01:00"
  open-pull-requests-limit: 10
