name: Build macOS (Mac App Store)

# Reusable: packages the Skia desktop head as a universal (arm64 + x64) sandboxed app for the Mac App Store, with
# build/macos/package-app-store.sh. With the signing material it produces an installer-signed .pkg; without it, an
# unsigned universal .app zip (there is no unsigned App Store package). See docs/mac-app-store.md.
# Publishing lives in release.yml - this workflow never talks to a store.

on:
  workflow_call:
    inputs:
      channel:        { type: string, required: true }
      version_simple: { type: string, required: true }
      artifact_name:  { type: string, required: true }
    secrets:
      APPLE_DISTRIBUTION_P12_BASE64:           { required: false }
      APPLE_P12_PASSWORD:                      { required: false }
      APPLE_MAC_INSTALLER_P12_BASE64:          { required: false }
      APPLE_MACOS_PROVISIONING_PROFILE_BASE64: { required: false }
      APPLE_CODESIGN_KEY:                      { required: false }
      KEYCHAIN_PASSWORD:                       { required: false }

permissions:
  contents: read

jobs:
  build:
    # Same image as the desktop head's osx-arm64 leg. The desktop head needs no Apple workload, so unlike iOS it
    # doesn't depend on the newest Xcode; the native host comes prebuilt from Uno.
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      ContinuousIntegrationBuild: true
      # All four or it is treated as not configured. APPLE_CODESIGN_KEY and KEYCHAIN_PASSWORD are optional.
      HAS_SIGNING: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 != '' && secrets.APPLE_P12_PASSWORD != '' && secrets.APPLE_MAC_INSTALLER_P12_BASE64 != '' && secrets.APPLE_MACOS_PROVISIONING_PROFILE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-dotnet-build

      - name: Show Xcode version
        run: xcodebuild -version

      # The app is signed with "Apple Distribution" and the package with "3rd Party Mac Developer Installer".
      - name: Import signing certificates
        if: env.HAS_SIGNING == 'true'
        env:
          DISTRIBUTION_P12: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          INSTALLER_P12: ${{ secrets.APPLE_MAC_INSTALLER_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="${KEYCHAIN_PASSWORD:-$(openssl rand -base64 24)}"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$DISTRIBUTION_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          echo "$INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          for p12 in distribution installer; do
            security import "$RUNNER_TEMP/$p12.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          done
          rm "$RUNNER_TEMP"/*.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          existing="$(security list-keychains -d user | tr -d '"')"
          # shellcheck disable=SC2086 # one keychain path per word
          security list-keychains -d user -s "$keychain" $existing
          security find-identity -v "$keychain"

      - name: Install provisioning profile
        if: env.HAS_SIGNING == 'true'
        env:
          PROFILE: ${{ secrets.APPLE_MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/AppStore.provisionprofile"

      - name: Package
        env:
          APP_CHANNEL: ${{ inputs.channel }}
          APP_VERSION: ${{ inputs.version_simple }}
          CODESIGN_KEY: ${{ secrets.APPLE_CODESIGN_KEY }}
        run: |
          set -euo pipefail
          if [ "$HAS_SIGNING" = "true" ]; then
            # An empty CODESIGN_KEY falls back to the script's "Apple Distribution".
            [ -n "$CODESIGN_KEY" ] || unset CODESIGN_KEY
            bash build/macos/package-app-store.sh "$RUNNER_TEMP/AppStore.provisionprofile"
          else
            echo "::notice::APPLE_DISTRIBUTION_P12_BASE64, APPLE_P12_PASSWORD, APPLE_MAC_INSTALLER_P12_BASE64 and APPLE_MACOS_PROVISIONING_PROFILE_BASE64 are not all set - building an UNSIGNED universal app. This is expected in a fork and on main; the Mac App Store jobs will skip."
            unset CODESIGN_KEY
            bash build/macos/package-app-store.sh
          fi

      - name: Verify the bundle version
        run: |
          set -euo pipefail
          app="$(find artifacts/macos -maxdepth 1 -name '*.app' | head -1)"
          [ -n "$app" ] || { echo "::error::no .app bundle in artifacts/macos"; exit 1; }
          plist="$app/Contents/Info.plist"
          cv="$(plutil -extract CFBundleVersion raw "$plist")"
          sv="$(plutil -extract CFBundleShortVersionString raw "$plist")"
          id="$(plutil -extract CFBundleIdentifier raw "$plist")"
          echo "Info.plist: CFBundleIdentifier=$id CFBundleVersion=$cv CFBundleShortVersionString=$sv"
          [ "$cv" = "${{ inputs.version_simple }}" ] || { echo "::error::CFBundleVersion is $cv, expected ${{ inputs.version_simple }}"; exit 1; }
          [ "$sv" = "${{ inputs.version_simple }}" ] || { echo "::error::CFBundleShortVersionString is $sv, expected ${{ inputs.version_simple }}"; exit 1; }
          archs="$(lipo -archs "$app/Contents/MacOS/$(plutil -extract CFBundleExecutable raw "$plist")")"
          echo "Executable architectures: $archs"
          case "$archs" in
            *arm64*x86_64*|*x86_64*arm64*) ;;
            *) echo "::error::the bundle is not universal ($archs)"; exit 1 ;;
          esac

      - name: Stage
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage"
          cp artifacts/macos/*.pkg artifacts/macos/*.app.zip "$RUNNER_TEMP/stage/" 2>/dev/null || true
          ls -la "$RUNNER_TEMP/stage"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/stage
          retention-days: ${{ inputs.channel == 'Prod' && 90 || 14 }}
          if-no-files-found: error
