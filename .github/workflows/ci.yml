name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "release/**" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  guards:
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-dotnet-build

      # The checked-in Package.appxmanifest is a TEMPLATE that Uno regenerates into obj/
      # with the NBGV version. The 0.0.0.0 pin is load-bearing and stays enforced.
      - name: Package.appxmanifest Identity Version must stay pinned at 0.0.0.0
        run: |
          set -euo pipefail
          v=$(grep -o 'Version="[^"]*"' src/AppTemplate/Package.appxmanifest | head -1 | sed 's/.*="//;s/"//' || true)
          echo "Identity Version in the checked-in manifest: $v"
          if [ "$v" != "0.0.0.0" ]; then
            echo "::error::Package.appxmanifest Identity Version must remain 0.0.0.0 - it is stamped at build time by SetNbgvVersionForUnoWindows."
            exit 1
          fi

      - name: Version sanity
        uses: ./.github/actions/app-version
        with:
          version-code-offset: ${{ vars.VERSION_CODE_OFFSET }}

  test:
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-dotnet-build

      # MSTest on Microsoft.Testing.Platform. Do NOT pass VSTest-only flags
      # (--nologo, --logger); MTP errors out on them.
      - name: Run unit tests
        run: dotnet test tests/AppTemplate.Core.Tests/AppTemplate.Core.Tests.csproj -c Release

  build:
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: desktop, tfm: net10.0-desktop,           os: ubuntu-24.04 }
          - { name: wasm,    tfm: net10.0-browserwasm,       os: ubuntu-24.04 }
          - { name: android, tfm: net10.0-android,           os: ubuntu-24.04 }
          - { name: windows, tfm: net10.0-windows10.0.26100, os: windows-2025 }
          # iOS is deliberately absent: macOS runners bill at 10x and every push to main
          # already builds the iOS head in build-main.yml.
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      ContinuousIntegrationBuild: true

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-dotnet-build
        with:
          workloads: src/AppTemplate.slnx

      - name: Install wasm-tools
        if: matrix.name == 'wasm'
        run: dotnet workload install wasm-tools

      # Release, not Debug: trimming and AOT analyzer failures must surface on a PR,
      # not on a release branch.
      - name: Build ${{ matrix.name }}
        run: dotnet build src/AppTemplate/AppTemplate.csproj -c Release -f ${{ matrix.tfm }} -p:AppChannel=Dev
