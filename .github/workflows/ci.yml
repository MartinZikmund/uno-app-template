name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "release/**" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  guards:
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-dotnet-build

      - name: Version sanity
        uses: ./.github/actions/app-version
        with:
          version-code-offset: ${{ vars.VERSION_CODE_OFFSET }}

  #if (tests)
  test:
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Workloads are required even though the test project is plain net10.0: it
      # references AppTemplate.Core, which is an Uno.Sdk project multi-targeting android,
      # iOS, Windows, desktop and wasm, so restoring it pulls in every one of those.
      # Restricting it with -p:TargetFrameworks=net10.0 is not an option - that global
      # property also reaches the test project and breaks MSTest.Sdk's adapter
      # registration ("The test framework adapter has not been registered").
      - uses: ./.github/actions/setup-dotnet-build
        with:
          workloads: src/AppTemplate.slnx

      # MSTest on Microsoft.Testing.Platform. Do NOT pass VSTest-only flags
      # (--nologo, --logger); MTP errors out on them.
      - name: Run unit tests
        run: dotnet test tests/AppTemplate.Core.Tests/AppTemplate.Core.Tests.csproj -c Release --report-trx --coverage --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: warn
  #endif

  #if (hasDesktop || hasWasm || hasAndroid || hasWindows)
  build:
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          #if (hasDesktop)
          - { name: desktop, tfm: net10.0-desktop,           os: ubuntu-24.04 }
          #endif
          #if (hasWasm)
          - { name: wasm,    tfm: net10.0-browserwasm,       os: ubuntu-24.04 }
          #endif
          #if (hasAndroid)
          - { name: android, tfm: net10.0-android,           os: ubuntu-24.04 }
          #endif
          #if (hasWindows)
          - { name: windows, tfm: net10.0-windows10.0.26100, os: windows-2025 }
          #endif
          #if (hasTvos)
          # Compile only: bundling, AOT and the simulator smoke test need a Mac (build-main.yml).
          - { name: tvos,    tfm: net10.0-tvos,              os: windows-2025 }
          #endif
          # iOS is deliberately absent: macOS runners bill at 10x and every push to main
          # already builds the iOS head in build-main.yml.
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      ContinuousIntegrationBuild: true

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-dotnet-build
        with:
          workloads: src/AppTemplate.slnx

      - name: Install wasm-tools
        if: matrix.name == 'wasm'
        run: dotnet workload install wasm-tools

      # Release, not Debug: trimming and AOT analyzer failures must surface on a PR,
      # not on a release branch.
      - name: Build ${{ matrix.name }}
        run: dotnet build src/AppTemplate/AppTemplate.csproj -c Release -f ${{ matrix.tfm }} -p:AppChannel=Dev
  #endif

# Keep this line last: the template engine can't close a block on a file's final line.
