name: WASM PR preview

# Deploys a per-PR preview of the WebAssembly head to an Azure Static Web Apps
# environment, and tears it down when the PR closes. Production web deploys live in
# release.yml.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [ main ]

concurrency:
  group: wasm-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    if: github.event.action != 'closed' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      TFM: net10.0-browserwasm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-dotnet-build
        with:
          workloads: src/AppTemplate.slnx
      - name: Install wasm-tools
        run: dotnet workload install wasm-tools
      - name: Publish
        run: dotnet publish src/AppTemplate/AppTemplate.csproj -c Release -f "$TFM" -p:AppChannel=Dev
      - name: Deploy preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURESTATICWEBAPPSDEPLOYMENTTOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "src/AppTemplate/bin/Release/net10.0-browserwasm/publish/wwwroot"
          skip_app_build: true
          skip_api_build: true
          # A fork without the token gets a green, skipped preview.
          skip_deploy_on_missing_secrets: true

  close:
    if: github.event.action == 'closed' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURESTATICWEBAPPSDEPLOYMENTTOKEN }}
          action: close
          skip_deploy_on_missing_secrets: true
