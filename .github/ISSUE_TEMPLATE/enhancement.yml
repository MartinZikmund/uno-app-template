name: Enhancement
description: Suggest an improvement to existing functionality
labels: [enhancement]
body:
  - type: textarea
    id: description
    attributes:
      label: What would you like improved?
      description: Describe the enhancement you have in mind.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Why / use case
      description: Why would this improvement be useful?
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Version of the app this enhancement applies to.
      placeholder: e.g. 1.2.0

  - type: dropdown
    id: platforms
    attributes:
      label: Affected platform(s)
      description: Which platform(s) does this enhancement affect?
      multiple: true
      options:
        - All platforms
        - WebAssembly
        - Android
        - iOS
        - macOS
        - Windows
        - Linux

  - type: dropdown
    id: renderer
    attributes:
      label: Renderer
      description: Which renderer is this relevant to? Your app uses Skia if you find `SkiaRenderer` in the `.csproj` project file.
      multiple: true
      options:
        - All renderers
        - Skia
        - Native

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Any other information or screenshots.
